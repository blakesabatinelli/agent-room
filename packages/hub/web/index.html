<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agent Room">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/web/manifest.webmanifest">
<link rel="apple-touch-icon" href="/web/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/web/favicon-32.png">
<link rel="stylesheet" href="/web/app.css">
<title>Agent Room</title>
</head>
<body>
<header id="bar">
  <button id="back" class="icon" aria-label="Back" hidden>‹</button>
  <div id="title">Agent Room</div>
  <button id="officeBtn" class="pill quiet" hidden>Office</button>
  <button id="approvalsBtn" class="pill" hidden>Approvals <span id="approvalsCount"></span></button>
  <span id="dot" class="dot" title="Connection"></span>
</header>
<main id="view"></main>
<button id="jumpNew" hidden>↑ New messages</button>
<footer id="composer" hidden>
  <div id="palette" role="listbox" aria-label="Commands" hidden></div>
  <div id="working"></div>
  <div id="folderPick" hidden></div>
  <div id="steer" hidden>
    <button data-steer="/redirect ">Redirect</button>
    <button data-steer="/replan ">Change direction</button>
    <button data-steer="/stop" class="danger">Stop</button>
  </div>
  <form id="send">
    <textarea id="input" rows="1" placeholder="Message" autocomplete="off" autocorrect="on" enterkeyhint="send"></textarea>
    <button id="sendBtn" type="submit" aria-label="Send">↑</button>
  </form>
</footer>
<div id="toast" hidden></div>
<script src="/web/diff.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
