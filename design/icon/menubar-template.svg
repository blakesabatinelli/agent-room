<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Agent Room menu bar glyph (template image: black on transparent)</title>
  <!-- A ring for the table, four seats around it. Black only; macOS tints it for light and dark menu bars. -->
  <circle cx="32" cy="32" r="12" fill="none" stroke="#000000" stroke-width="7"/>
  <circle cx="14" cy="14" r="7" fill="#000000"/>
  <circle cx="50" cy="14" r="7" fill="#000000"/>
  <circle cx="14" cy="50" r="7" fill="#000000"/>
  <circle cx="50" cy="50" r="7" fill="#000000"/>
</svg>
